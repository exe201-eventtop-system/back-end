services:
  apigateway:
    build:
      context: ./API-Gatewate
      dockerfile: ./API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - userservice
      - feedbackservice
      - productservice
    networks:
      - backend

  userservice:
    build:
      context: ./UserService
      dockerfile: ./UserService.API/Dockerfile
    ports:
      - "5001:5001"
    networks:
      - backend

  productservice:
    build:
      context: ./ProductService
    ports:
      - "8082:8082"
    networks:
      - backend


networks:
  backend:
    driver: bridge
